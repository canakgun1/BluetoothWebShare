<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Can File Sharing</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
    <button onclick=başlat() id="başlatbutton">Bağlantıyı başlat</button>
    <h1 id="status">Bekliyor</h1>

    <input type="text" id="yaz">

    <button id="gönder">Gönder</button>
    <h3 id="gelenmesaj"></h3>
    
  
  <script>


    const socket = new WebSocket("wss://mail1.cakgun.com/ws");

    socket.onopen = () => {
      console.log("Socketa bağlandık.");
      
    };

    
    const peerConnection = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    });

    const dataChannel = peerConnection.createDataChannel("messages");

    peerConnection.ondatachannel = (event) => {
      const dataChannel = event.channel;
      console.log("Data channel var");
      dataChannel.onopen = () => {
        console.log("Data channel açıldı");
      };
      let fileInfo;
      let parçalar = [];
      let gelenSize = 0;
      dataChannel.onmessage = (event) => {
        if (typeof event.data === "string") {
          const message = JSON.parse(event.data);

          if (message.type === "text") {
            console.log("Gelen yazı:", message.text);
            document.getElementById("gelenmesaj").innerText = message.text;
          }
          return;
        }
        
        
      }
    };


    dataChannel.onopen = () => {
      document.getElementById("status").innerText = "Bağlandı OK";
      console.log("Data channel ikisinde de açıldı.");
    }


    peerConnection.onconnectionstatechange = () => {
      console.log("Yeni WEBRTC state:", peerConnection.connectionState);
    }

    peerConnection.onicecandidate = (event) => {
      console.log("ICE event:", event.candidate);
      if (event.candidate) {
        socket.send(JSON.stringify({
          type: "ice",
          data: event.candidate
        }));
      }
    }

    console.log("ICE gathering state:", peerConnection.iceGatheringState);
    peerConnection.onicegatheringstatechange = () => {
      console.log("ICE gathering:", peerConnection.iceGatheringState);
    };

    socket.onmessage = async (event) => {
      const data = await event.data.text();
      const message = JSON.parse(data);

      if (message.type === "offer") {
        await peerConnection.setRemoteDescription(message.data);
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.send(JSON.stringify({
          type:"answer",
          data:peerConnection.localDescription
        }));
      }
      if (message.type === "answer") {
        await peerConnection.setRemoteDescription(message.data);
      }
      if (message.type === "ice") {
        await peerConnection.addIceCandidate(message.data);
      }
    };

    async function başlat() {
      const offer = await peerConnection.createOffer();

      await peerConnection.setLocalDescription(offer);

      socket.send(JSON.stringify({
        type: "offer",
        data: peerConnection.localDescription
      }));
    };


    document.getElementById("gönder").onclick = async (event) => {
      const yazı = document.getElementById("yaz").value;
      if (!yazı) {
        return;
      }
      console.log("Yazı gidiyor", yazı);
      

      dataChannel.send(JSON.stringify({
        type: "text",
        text: yazı
      }));
      
    };

  </script>
</body>
</html>

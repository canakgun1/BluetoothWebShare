<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Can File Sharing</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
    <button onclick=başlat() id="başlatbutton">Bağlantıyı başlat</button>

    <input type="file" id="dosya">
    <img id="resim">
  
  <script>


    const socket = new WebSocket("wss://mail1.cakgun.com/ws");

    socket.onopen = () => {
      console.log("Socketa bağlandık.");
      
    };

    
    const peerConnection = new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    });

    const dataChannel = peerConnection.createDataChannel("messages");

    peerConnection.ondatachannel = (event) => {
      const dataChannel = event.channel;
      console.log("Data channel var");
      dataChannel.onopen = () => {
        console.log("Data channel açıldı");
      };
      let fileInfo;
      let parçalar = [];
      let gelenSize = 0;
      dataChannel.onmessage = (event) => {
        if (typeof event.data === "string") {
          const message = JSON.parse(event.data);

          if (message.type === "file-info") {
            fileInfo = message;
            parçalar = [];
            gelenSize = 0;

            console.log("Gelecek dosya:", fileInfo.name);
          }
          return;
        }
        parçalar.push(event.data);
        gelenSize += event.data.byteLength;
        if (gelenSize === fileInfo.size) {
          const blob = new Blob(parçalar, {
            type: fileInfo.mimeType
          });
          const url = URL.createObjectURL(blob);
          const resim = document.getElementById("resim");
          resim.src = url;

          
        }
        
      }
    };

    document.getElementById("resim").onload = () => {
          const scale = Math.min(
            window.innerWidth / resim.naturalWidth,
            window.innerHeight / resim.naturalHeight,
            1
        );
        

        resim.style.width = `${resim.naturalWidth * scale}px`;
        resim.style.height = `${resim.naturalHeight * scale}px`;
        
    };

    dataChannel.onopen = () => {
      console.log("Data channel ikisinde de açıldı.");
    }


    peerConnection.onconnectionstatechange = () => {
      console.log("Yeni WEBRTC state:", peerConnection.connectionState);
    }

    peerConnection.onicecandidate = (event) => {
      console.log("ICE event:", event.candidate);
      if (event.candidate) {
        socket.send(JSON.stringify({
          type: "ice",
          data: event.candidate
        }));
      }
    }

    console.log("ICE gathering state:", peerConnection.iceGatheringState);
    peerConnection.onicegatheringstatechange = () => {
      console.log("ICE gathering:", peerConnection.iceGatheringState);
    };

    socket.onmessage = async (event) => {
      const data = await event.data.text();
      const message = JSON.parse(data);

      if (message.type === "offer") {
        await peerConnection.setRemoteDescription(message.data);
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.send(JSON.stringify({
          type:"answer",
          data:peerConnection.localDescription
        }));
      }
      if (message.type === "answer") {
        await peerConnection.setRemoteDescription(message.data);
      }
      if (message.type === "ice") {
        await peerConnection.addIceCandidate(message.data);
      }
    };

    async function başlat() {
      const offer = await peerConnection.createOffer();

      await peerConnection.setLocalDescription(offer);

      socket.send(JSON.stringify({
        type: "offer",
        data: peerConnection.localDescription
      }));
    };


    document.getElementById("dosya").onchange = async (event) => {
      const dosya = event.target.files[0];
      if (!dosya) {
        return;
      }
      console.log("Dosya gidiyor", dosya.name);
      

      dataChannel.send(JSON.stringify({
        type: "file-info",
        name: dosya.name,
        size: dosya.size,
        mimeType: dosya.type
      }));

      const data = await dosya.arrayBuffer();
      const parça = 16 * 1024;

      for (let i = 0; i < data.byteLength; i+= parça) {
        const buParça = data.slice(i, i + parça);
        dataChannel.send(buParça);
      }
      
    };

  </script>
</body>
</html>
